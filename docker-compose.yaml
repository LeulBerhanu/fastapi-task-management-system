services:
  api:
    build: .
    container_name: task-management-api

    ports:
      - "8000:8000"

    env_file:
      - .env

    depends_on:
      - postgres

    command:
      [
        "uv",
        "run",
        "uvicorn",
        "app.main:app",
        "--host",
        "0.0.0.0",
        "--port",
        "8000",
        "--reload",
      ]

    volumes:
      - .:/app

  postgres:
    image: postgres:17

    container_name: task-management-postgres

    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
